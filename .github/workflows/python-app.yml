name: Python App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.11.15", "3.11.16", "3.11.17", "3.11.18", "3.12", "3.12.13", "3.12.14", "3.12.15", "3.12.16", "3.13", "3.13.15", "3.13.16", "3.13.17", "3.13.18", "3.14", "3.14.7", "3.14.8", "3.14.9", "3.14.10"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up environment
        run: ./src/script/setup-dev.bash

      - name: Run PyLint
        run: ./src/script/qa-pylint.bash

      - name: Run Flake8
        run: ./src/script/qa-flake8.bash
